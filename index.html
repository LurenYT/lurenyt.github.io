<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Планировщик дня</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        * {
            font-family: 'Inter', sans-serif;
        }
        
        .task-card {
            transition: all 0.2s ease;
        }
        
        .task-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }
        
        .checkbox-circle {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .checkbox-circle:active {
            transform: scale(0.9);
        }
        
        .time-badge {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        
        .fade-in {
            animation: fadeIn 0.4s ease-out;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .modal {
            backdrop-filter: blur(8px);
        }
        
        .completed-task {
            opacity: 0.6;
        }
        
        .user-avatar {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            font-size: 12px;
            font-weight: 600;
            color: white;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-blue-50 to-indigo-100 min-h-screen">
    <div id="app"></div>

    <script>
        const API_URL = 'https://api.jsonbin.io/v3/b/69337b1543b1c97be9dab850';
        const API_KEY = '$2a$10$pbtPMpvGcN5Z1uwMzGDEZ.MOZ3L4gcc6ah5qASWmGJBsR9d31lWp2';
        
        let tasks = [];
        let editingId = null;
        let selectedDate = new Date().toISOString().split('T')[0];
        let preservedInput = { text: '', time: '' };
        let currentUser = null;
        let syncEnabled = false;
        let showShareModal = false;
        let isInitialLoad = true;

        function initUser() {
            let user = localStorage.getItem('planner-user');
            if (!user) {
                const name = prompt('Как вас зовут?', 'Пользователь');
                if (!name) return;
                
                const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE', '#85C1E2'];
                user = {
                    id: Date.now().toString(),
                    name: name,
                    color: colors[Math.floor(Math.random() * colors.length)]
                };
                localStorage.setItem('planner-user', JSON.stringify(user));
            } else {
                user = JSON.parse(user);
            }
            currentUser = user;
        }

        function getUserColor(userId) {
            if (!userId) return '#9CA3AF';
            const users = JSON.parse(localStorage.getItem('planner-users') || '{}');
            return users[userId]?.color || '#9CA3AF';
        }

        function getUserName(userId) {
            if (!userId) return 'Без автора';
            const users = JSON.parse(localStorage.getItem('planner-users') || '{}');
            return users[userId]?.name || 'Неизвестный';
        }

        function saveUserToCache(user) {
            const users = JSON.parse(localStorage.getItem('planner-users') || '{}');
            users[user.id] = user;
            localStorage.setItem('planner-users', JSON.stringify(users));
        }

        function loadTasks() {
            const saved = localStorage.getItem('daily-planner-tasks');
            if (saved) {
                tasks = JSON.parse(saved);
                const today = new Date().toISOString().split('T')[0];
                tasks = tasks.map(task => {
                    if (!task.date) {
                        return { ...task, date: today };
                    }
                    return task;
                });
            }
            
            isInitialLoad = false;
            
            if (syncEnabled) {
                loadFromCloud();
            }
            
            render();
        }

        async function loadFromCloud() {
            try {
                // Сохраняем текущее состояние полей ввода перед обновлением
                saveInputState();
                
                const response = await fetch(API_URL + '/latest', {
                    headers: { 'X-Master-Key': API_KEY }
                });
                
                if (response.ok) {
                    const data = await response.json();
                    if (data.record && data.record.tasks) {
                        // Проверяем, есть ли реальные изменения
                        const currentTasksJSON = JSON.stringify(tasks);
                        const newTasksJSON = JSON.stringify(data.record.tasks);
                        
                        if (currentTasksJSON !== newTasksJSON) {
                            tasks = data.record.tasks;
                            
                            if (data.record.users) {
                                localStorage.setItem('planner-users', JSON.stringify(data.record.users));
                            }
                            
                            localStorage.setItem('daily-planner-tasks', JSON.stringify(tasks));
                            render();
                            restoreInputState(); // Восстанавливаем после рендера
                        }
                    }
                }
            } catch (error) {
                console.log('Работаем в локальном режиме');
            }
        }

        function saveTasks() {
            localStorage.setItem('daily-planner-tasks', JSON.stringify(tasks));
            
            if (syncEnabled) {
                saveToCloud();
            }
        }

        async function saveToCloud() {
            try {
                const users = JSON.parse(localStorage.getItem('planner-users') || '{}');
                if (currentUser) {
                    users[currentUser.id] = currentUser;
                }
                
                await fetch(API_URL, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Master-Key': API_KEY
                    },
                    body: JSON.stringify({ tasks: tasks, users: users })
                });
            } catch (error) {
                console.log('Сохранено локально');
            }
        }

        function saveInputState() {
            const input = document.getElementById('newTask');
            const timeInput = document.getElementById('newTime');
            if (input) preservedInput.text = input.value;
            if (timeInput) preservedInput.time = timeInput.value;
        }

        function restoreInputState() {
            setTimeout(() => {
                const input = document.getElementById('newTask');
                const timeInput = document.getElementById('newTime');
                if (input && preservedInput.text) {
                    input.value = preservedInput.text;
                }
                if (timeInput && preservedInput.time) {
                    timeInput.value = preservedInput.time;
                }
            }, 50);
        }

        function addTask() {
            const input = document.getElementById('newTask');
            const timeInput = document.getElementById('newTime');
            const text = input.value.trim();
            
            if (!text) {
                input.focus();
                return;
            }
            
            const task = {
                id: Date.now(),
                text: text,
                time: timeInput.value,
                date: selectedDate,
                completed: false,
                completedBy: null,
                createdBy: currentUser.id,
                createdAt: new Date().toISOString()
            };
            
            tasks.push(task);
            sortTasks();
            saveTasks();
            
            input.value = '';
            timeInput.value = '';
            preservedInput = { text: '', time: '' };
            
            render();
            input.focus();
        }

        function sortTasks() {
            tasks.sort((a, b) => {
                if (!a.time) return 1;
                if (!b.time) return -1;
                return a.time.localeCompare(b.time);
            });
        }

        function toggleComplete(id) {
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.completed = !task.completed;
                task.completedBy = task.completed ? currentUser.id : null;
                saveTasks();
                render();
                setTimeout(restoreInputState, 50);
            }
        }

        function deleteTask(id) {
            if (!confirm('Удалить эту задачу?')) return;
            
            tasks = tasks.filter(t => t.id !== id);
            saveTasks();
            render();
            setTimeout(restoreInputState, 50);
        }

        function startEdit(id) {
            editingId = id;
            render();
            setTimeout(() => {
                const editInput = document.getElementById('editText-' + id);
                if (editInput) editInput.focus();
                restoreInputState();
            }, 100);
        }

        function saveEdit(id) {
            const textInput = document.getElementById('editText-' + id);
            const timeInput = document.getElementById('editTime-' + id);
            
            const task = tasks.find(t => t.id === id);
            if (task) {
                task.text = textInput.value;
                task.time = timeInput.value;
                editingId = null;
                sortTasks();
                saveTasks();
                render();
                setTimeout(restoreInputState, 50);
            }
        }

        function changeDate(newDate) {
            selectedDate = newDate;
            render();
            setTimeout(restoreInputState, 50);
        }

        function getFilteredTasks() {
            return tasks.filter(task => task.date === selectedDate);
        }

        function getDisplayDate() {
            const date = new Date(selectedDate + 'T00:00:00');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('ru-RU', options);
        }
        
        function formatTime(time) {
            if (!time) return '';
            const [hours, minutes] = time.split(':');
            return `${hours}:${minutes}`;
        }

        function toggleShareModal() {
            showShareModal = !showShareModal;
            render();
        }

        function enableSync() {
            if (confirm('Включить облачную синхронизацию? Требуется настроенная база данных JSONBin.')) {
                syncEnabled = true;
                localStorage.setItem('sync-enabled', 'true');
                showShareModal = false;
                render();
                loadFromCloud();
                setInterval(loadFromCloud, 10000);
            }
        }

        function copyShareLink() {
            const link = window.location.href;
            navigator.clipboard.writeText(link).then(() => {
                alert('Ссылка скопирована! Отправьте её другу для совместной работы.');
            });
        }

        function changeUserName() {
            const newName = prompt('Введите новое имя:', currentUser.name);
            if (newName && newName.trim()) {
                currentUser.name = newName.trim();
                localStorage.setItem('planner-user', JSON.stringify(currentUser));
                saveUserToCache(currentUser);
                saveTasks();
                render();
            }
        }

        function render() {
            const app = document.getElementById('app');
            
            if (isInitialLoad && tasks.length === 0) {
                app.innerHTML = `
                    <div class="min-h-screen flex items-center justify-center">
                        <div class="text-gray-600 flex items-center gap-3">
                            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-purple-600"></div>
                            <span>Загрузка данных...</span>
                        </div>
                    </div>
                `;
                return;
            }
            
            const filteredTasks = getFilteredTasks();
            const completedCount = filteredTasks.filter(t => t.completed).length;
            const remainingCount = filteredTasks.length - completedCount;
            const today = new Date().toISOString().split('T')[0];
            const isToday = selectedDate === today;

            app.innerHTML = `
                <div class="max-w-4xl mx-auto p-4 md:p-8">
                    <div class="bg-white rounded-3xl shadow-xl mb-6 overflow-hidden">
                        <div class="bg-gradient-to-r from-purple-600 via-blue-600 to-indigo-600 text-white p-6">
                            <div class="flex items-center justify-between mb-4">
                                <h1 class="text-3xl md:text-4xl font-bold flex items-center gap-3">
                                    📋 Мой день
                                </h1>
                                <div class="flex items-center gap-3">
                                    <button 
                                        onclick="toggleShareModal()"
                                        class="bg-white bg-opacity-20 hover:bg-opacity-30 px-4 py-2 rounded-full text-sm font-medium transition-all flex items-center gap-2"
                                    >
                                        👥 Пригласить
                                    </button>
                                    <div class="text-sm bg-white bg-opacity-20 px-4 py-2 rounded-full">
                                        ${syncEnabled ? '☁️ Облако' : '💾 Локально'}
                                    </div>
                                </div>
                            </div>
                            
                            <div class="flex items-center gap-2 mb-4">
                                <span class="user-avatar" style="background-color: ${currentUser.color}">
                                    ${currentUser.name.charAt(0).toUpperCase()}
                                </span>
                                <span class="text-white text-sm font-medium">${currentUser.name}</span>
                                <button onclick="changeUserName()" class="text-white text-xs hover:underline ml-2">
                                    ✏️ изменить
                                </button>
                            </div>
                            
                            <div class="flex items-center gap-3 mb-3">
                                <button 
                                    onclick="changeDate('${new Date(new Date(selectedDate).getTime() - 86400000).toISOString().split('T')[0]}')"
                                    class="bg-white bg-opacity-20 hover:bg-opacity-30 p-3 rounded-xl transition-all backdrop-blur"
                                >
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                                        <polyline points="15 18 9 12 15 6"></polyline>
                                    </svg>
                                </button>
                                
                                <input 
                                    type="date" 
                                    value="${selectedDate}"
                                    onchange="changeDate(this.value)"
                                    class="flex-1 px-4 py-3 rounded-xl text-gray-800 font-semibold focus:outline-none focus:ring-4 focus:ring-white focus:ring-opacity-50 cursor-pointer"
                                />
                                
                                ${!isToday ? `
                                    <button 
                                        onclick="changeDate('${today}')"
                                        class="bg-white bg-opacity-20 hover:bg-opacity-30 px-4 py-3 rounded-xl transition-all font-medium backdrop-blur whitespace-nowrap"
                                    >
                                        🏠 Сегодня
                                    </button>
                                ` : ''}
                                
                                <button 
                                    onclick="changeDate('${new Date(new Date(selectedDate).getTime() + 86400000).toISOString().split('T')[0]}')"
                                    class="bg-white bg-opacity-20 hover:bg-opacity-30 p-3 rounded-xl transition-all backdrop-blur"
                                >
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
                                        <polyline points="9 18 15 12 9 6"></polyline>
                                    </svg>
                                </button>
                            </div>
                            
                            <p class="text-blue-100 capitalize text-lg">${getDisplayDate()}</p>
                        </div>
                        
                        ${filteredTasks.length > 0 ? `
                            <div class="p-4 bg-gradient-to-r from-purple-50 to-blue-50">
                                <div class="grid grid-cols-3 gap-4 text-center">
                                    <div>
                                        <div class="text-2xl font-bold text-purple-600">${filteredTasks.length}</div>
                                        <div class="text-xs text-gray-600 font-medium">Всего задач</div>
                                    </div>
                                    <div>
                                        <div class="text-2xl font-bold text-green-600">${completedCount}</div>
                                        <div class="text-xs text-gray-600 font-medium">Выполнено</div>
                                    </div>
                                    <div>
                                        <div class="text-2xl font-bold text-orange-600">${remainingCount}</div>
                                        <div class="text-xs text-gray-600 font-medium">Осталось</div>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    ${showShareModal ? `
                        <div class="fixed inset-0 bg-black bg-opacity-50 modal z-50 flex items-center justify-center p-4" onclick="if(event.target === this) toggleShareModal()">
                            <div class="bg-white rounded-3xl shadow-2xl max-w-md w-full p-6 fade-in">
                                <div class="flex items-center justify-between mb-4">
                                    <h3 class="text-2xl font-bold text-gray-800">👥 Совместная работа</h3>
                                    <button onclick="toggleShareModal()" class="text-gray-400 hover:text-gray-600">
                                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                            <path d="M6 18L18 6M6 6l12 12" stroke-width="2"></path>
                                        </svg>
                                    </button>
                                </div>
                                <p class="text-gray-600 mb-4">Поделитесь этой ссылкой с другом, чтобы работать над задачами вместе:</p>
                                <div class="bg-gray-100 p-4 rounded-xl mb-4 break-all text-sm font-mono">
                                    ${window.location.href}
                                </div>
                                
                                ${!syncEnabled ? `
                                    <div class="bg-yellow-50 border-2 border-yellow-200 rounded-xl p-4 mb-4">
                                        <p class="text-sm text-yellow-800 mb-2">⚠️ Облачная синхронизация отключена</p>
                                        <button onclick="enableSync();" class="text-sm text-yellow-900 underline font-medium">
                                            Включить синхронизацию
                                        </button>
                                    </div>
                                ` : ''}
                                
                                <button onclick="copyShareLink()" class="w-full btn-primary text-white px-6 py-3 rounded-xl font-semibold shadow-lg">
                                    📋 Скопировать ссылку
                                </button>
                                <p class="text-xs text-gray-500 mt-4">
                                    💡 ${syncEnabled ? 
                                        'Все, у кого есть эта ссылка, смогут видеть и редактировать задачи.' : 
                                        'Для совместной работы нужно включить облачную синхронизацию.'
                                    }
                                </p>
                            </div>
                        </div>
                    ` : ''}

                    <div class="bg-white rounded-3xl shadow-lg p-6 mb-6">
                        <h3 class="text-lg font-semibold text-gray-800 mb-4">✨ Добавить задачу</h3>
                        <div class="flex flex-col md:flex-row gap-3">
                            <input
                                type="text"
                                id="newTask"
                                placeholder="Что нужно сделать?"
                                class="flex-1 px-5 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-purple-400 focus:ring-4 focus:ring-purple-100 transition-all text-base"
                                onkeypress="if(event.key==='Enter') addTask()"
                                oninput="saveInputState()"
                            />
                            <div class="flex gap-3">
                                <div class="relative">
                                    <svg class="absolute left-4 top-1/2 transform -translate-y-1/2 w-5 h-5 text-gray-400 pointer-events-none" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <circle cx="12" cy="12" r="10"></circle>
                                        <polyline points="12 6 12 12 16 14"></polyline>
                                    </svg>
                                    <input
                                        type="time"
                                        id="newTime"
                                        class="pl-12 pr-4 py-4 border-2 border-gray-200 rounded-2xl focus:outline-none focus:border-purple-400 focus:ring-4 focus:ring-purple-100 transition-all cursor-pointer text-base font-medium"
                                        onchange="saveInputState()"
                                    />
                                </div>
                                <button
                                    onclick="addTask()"
                                    class="btn-primary text-white px-8 py-4 rounded-2xl font-semibold shadow-lg flex items-center gap-2 whitespace-nowrap"
                                >
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                                        <line x1="12" y1="5" x2="12" y2="19"></line>
                                        <line x1="5" y1="12" x2="19" y2="12"></line>
                                    </svg>
                                    Добавить
                                </button>
                            </div>
                        </div>
                    </div>

                    <div class="space-y-3">
                        ${filteredTasks.length === 0 ? `
                            <div class="text-center py-20 fade-in">
                                <div class="bg-white rounded-3xl shadow-lg p-12">
                                    <div class="text-6xl mb-4">📝</div>
                                    <h3 class="text-2xl font-bold text-gray-800 mb-2">Пока нет задач</h3>
                                    <p class="text-gray-500">Добавьте первую задачу, чтобы начать планирование дня!</p>
                                </div>
                            </div>
                        ` : filteredTasks.map((task, index) => `
                            <div class="task-card bg-white rounded-2xl shadow-md p-5 fade-in ${task.completed ? 'completed-task' : ''}" style="animation-delay: ${index * 0.05}s">
                                <div class="flex items-start gap-4">
                                    <button
                                        onclick="toggleComplete(${task.id})"
                                        class="checkbox-circle flex-shrink-0 w-7 h-7 rounded-full border-3 flex items-center justify-center transition-all mt-1 ${
                                            task.completed
                                                ? 'bg-gradient-to-br from-green-400 to-green-600 border-green-600 shadow-lg'
                                                : 'border-gray-300 hover:border-purple-400 hover:bg-purple-50'
                                        }"
                                    >
                                        ${task.completed ? `
                                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3">
                                                <polyline points="20 6 9 17 4 12"></polyline>
                                            </svg>
                                        ` : ''}
                                    </button>

                                    <div class="flex-1 min-w-0">
                                        ${editingId === task.id ? `
                                            <div class="space-y-3">
                                                <input
                                                    type="text"
                                                    id="editText-${task.id}"
                                                    value="${task.text}"
                                                    class="w-full px-4 py-3 border-2 border-purple-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-purple-100 text-base"
                                                />
                                                <input
                                                    type="time"
                                                    id="editTime-${task.id}"
                                                    value="${task.time || ''}"
                                                    class="w-full px-4 py-3 border-2 border-purple-300 rounded-xl focus:outline-none focus:ring-4 focus:ring-purple-100"
                                                />
                                            </div>
                                        ` : `
                                            <div class="space-y-2">
                                                <div class="flex items-start gap-3 flex-wrap">
                                                    ${task.time ? `
                                                        <span class="time-badge text-white px-3 py-1 rounded-lg text-sm font-bold shadow-md flex-shrink-0">
                                                            🕐 ${formatTime(task.time)}
                                                        </span>
                                                    ` : ''}
                                                    <p class="text-base font-medium flex-1 ${task.completed ? 'line-through text-gray-400' : 'text-gray-800'}">
                                                        ${task.text}
                                                    </p>
                                                </div>
                                                <div class="flex items-center gap-2 text-xs text-gray-500">
                                                    <span class="user-avatar" style="background-color: ${getUserColor(task.createdBy)}; width: 20px; height: 20px; font-size: 10px;">
                                                        ${getUserName(task.createdBy).charAt(0).toUpperCase()}
                                                    </span>
                                                    <span>Создал: ${getUserName(task.createdBy)}</span>
                                                    ${task.completed && task.completedBy ? `
                                                        <span class="mx-1">•</span>
                                                        <span class="user-avatar" style="background-color: ${getUserColor(task.completedBy)}; width: 20px; height: 20px; font-size: 10px;">
                                                            ${getUserName(task.completedBy).charAt(0).toUpperCase()}
                                                        </span>
                                                        <span>Выполнил: ${getUserName(task.completedBy)}</span>
                                                    ` : ''}
                                                </div>
                                            </div>
                                        `}
                                    </div>

                                    <div class="flex gap-2 flex-shrink-0">
                                        ${editingId === task.id ? `
                                            <button
                                                onclick="saveEdit(${task.id})"
                                                class="text-green-600 hover:bg-green-50 p-2 rounded-xl transition-all"
                                                title="Сохранить"
                                            >
                                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                                    <polyline points="20 6 9 17 4 12"></polyline>
                                                </svg>
                                            </button>
                                        ` : `
                                            <button
                                                onclick="startEdit(${task.id})"
                                                class="text-gray-400 hover:text-purple-600 hover:bg-purple-50 p-2 rounded-xl transition-all"
                                                title="Редактировать"
                                            >
                                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                                                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                                                </svg>
                                            </button>
                                            <button
                                                onclick="deleteTask(${task.id})"
                                                class="text-gray-400 hover:text-red-600 hover:bg-red-50 p-2 rounded-xl transition-all"
                                                title="Удалить"
                                            >
                                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                                                    <polyline points="3 6 5 6 21 6"></polyline>
                                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                                </svg>
                                            </button>
                                        `}
                                    </div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                    
                    <div class="text-center mt-8 text-sm text-gray-500">
                        <p>${syncEnabled ? '☁️ Данные синхронизируются между всеми участниками' : '💾 Данные сохраняются локально на устройстве'}</p>
                    </div>
                </div>
            `;
        }

        initUser();
        if (currentUser) {
            saveUserToCache(currentUser);
            syncEnabled = localStorage.getItem('sync-enabled') === 'true';
            loadTasks();
            
            if (syncEnabled) {
                setInterval(loadFromCloud, 10000);
            }
            
            setTimeout(restoreInputState, 100);
        }
    </script>
</body>
</html>
